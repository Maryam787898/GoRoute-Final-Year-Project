name: goroute_app
description: "GoRoute - Bus Tracking App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Firebase ──────────────────────────────────────────────────────────
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^6.3.0

  # ── Map (OpenStreetMap — works on Android + Web, no API key needed) ───
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # ── Location / GPS ────────────────────────────────────────────────────
  # geolocator works on Android, iOS, and Web
  geolocator: ^13.0.2

  # ── UI / Misc ─────────────────────────────────────────────────────────
  lottie: ^3.3.1
  provider: ^6.1.5+1
  http: ^1.6.0
  google_fonts: ^6.3.2
  url_launcher: ^6.3.1
  firebase_messaging: ^16.2.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - Images/
